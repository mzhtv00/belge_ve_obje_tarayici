[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-scanner"
version = "0.1.0"
description = "Document scanning and photogrammetry processing pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "Pillow>=10",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.10"]
easyocr = ["easyocr>=1.7"]
photogrammetry = ["open3d>=0.18", "trimesh>=4.0"]
test = ["pytest>=8"]

[project.scripts]
photogrammetry-pipeline = "photogrammetry_pipeline:main"

[tool.setuptools]
py-modules = ["photogrammetry_pipeline"]

[tool.setuptools.packages.find]
include = ["document_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
