[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-scanner"
version = "0.1.0"
description = "Document scanning and photogrammetry processing pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.10"]
easyocr = ["easyocr>=1.7"]
photogrammetry = ["open3d>=0.18", "trimesh>=4.0"]
web = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "python-multipart>=0.0.9",
    "qrcode[pil]>=7.4,<9",
]
test = ["pytest>=8", "httpx2>=2,<3"]

[project.scripts]
object-scan-pipeline = "object_scan_pipeline:main"

[tool.setuptools]
py-modules = ["object_scan_pipeline"]

[tool.setuptools.packages.find]
include = ["app*", "document_scanner*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
